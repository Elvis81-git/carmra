<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級日誌與筆記</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
        }

        .stealth-controls {
            margin-top: 10px;
            text-align: right;
            opacity: 0.3; 
            transition: opacity 0.3s;
        }
        
        .stealth-controls:hover {
            opacity: 1; 
        }

        button {
            background-color: #e0e0e0;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            color: #555;
            font-size: 14px;
        }

        #camera-preview {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            z-index: -999;
            pointer-events: none;
        }

        /* --- 新增：黑畫面休眠遮罩 --- */
        #black-screen {
            position: fixed; /* 固定在螢幕上 */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000; /* 全黑 */
            z-index: 9999; /* 放在最上層 */
            display: none; /* 預設隱藏 */
        }

        /* --- 新增：隱形解鎖觸控區 --- */
        #unlock-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px; /* 只有螢幕最上方 80px 的範圍有反應 */
            /* background-color: rgba(255, 0, 0, 0.2); 測試時可以把這行打開，確認觸控位置 */
        }
    </style>
</head>
<body>

    <h2>電商科班級日誌</h2>
    <textarea placeholder="請輸入今日課堂紀錄或學生狀況..."></textarea>

    <div class="stealth-controls">
        <span id="status" style="font-size: 12px; margin-right: 10px;">!</span>
        <button id="switchBtn" title="切換前後鏡頭">🔄</button>
        <button id="startBtn">(S)</button>
        <button id="stopBtn" disabled>(E)</button>
        <button id="downloadBtn" disabled>D(0)</button>
    </div>

    <video id="camera-preview" autoplay muted playsinline></video>

    <div id="black-screen">
        <div id="unlock-zone"></div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        
        let useFrontCamera = true; 
        let currentExtension = 'webm';
        let videoUrls = []; 

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const switchBtn = document.getElementById('switchBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('status');
        const videoElement = document.getElementById('camera-preview');
        
        // 取得黑畫面與解鎖區塊的 DOM 元素
        const blackScreen = document.getElementById('black-screen');
        const unlockZone = document.getElementById('unlock-zone');

        function getSupportedMimeType() {
            const types = [
                'video/mp4', 
                'video/webm;codecs=vp9,opus', 
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    currentExtension = type.includes('mp4') ? 'mp4' : 'webm';
                    return type;
                }
            }
            return ''; 
        }

        switchBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                alert('錄影中無法切換鏡頭！');
                return;
            }
            useFrontCamera = !useFrontCamera;
            statusText.innerText = `... (${useFrontCamera ? 'F' : 'B'})`;
        });

        async function startRecording() {
            try {
                recordedChunks = [];
                const facingMode = useFrontCamera ? "user" : "environment";
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: facingMode } }, 
                    audio: true 
                });

                videoElement.srcObject = stream;

                const mimeType = getSupportedMimeType();
                const options = mimeType ? { mimeType: mimeType } : {};
                
                mediaRecorder = new MediaRecorder(stream, options);
                
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                    const url = URL.createObjectURL(blob);
                    
                    videoUrls.push(url);
                    
                    statusText.innerText = `1. ${videoUrls.length} `;
                    downloadBtn.disabled = false; 
                    downloadBtn.innerText = `D (${videoUrls.length})`;
                };

                mediaRecorder.start();
                
                // 【修改重點 1】開始錄影後，瞬間將黑畫面顯示出來
                blackScreen.style.display = 'block';

                statusText.innerText = `錄影中...`;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                switchBtn.disabled = true; 

            } catch (error) {
                console.error('相機開啟失敗:', error);
                if (error.name === 'OverconstrainedError') {
                    alert('裝置不支援此鏡頭方向。');
                } else {
                    statusText.innerText = '權限錯誤';
                }
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;

                startBtn.disabled = false;
                stopBtn.disabled = true;
                switchBtn.disabled = false; 
            }
        }

        function downloadAllVideos() {
            if (videoUrls.length > 0) {
                statusText.innerText = '...';
                
                videoUrls.forEach((url, index) => {
                    setTimeout(() => {
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = `1_${new Date().getTime()}_${index + 1}.${currentExtension}`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    }, index * 500); 
                });

                setTimeout(() => {
                    statusText.innerText = '記憶體已清空';
                    videoUrls.forEach(url => window.URL.revokeObjectURL(url)); 
                    videoUrls = []; 
                    downloadBtn.disabled = true;
                    downloadBtn.innerText = 'D (0)';
                }, videoUrls.length * 500 + 500);
            }
        }

        // 【修改重點 2】設定解鎖區塊的點擊事件
        unlockZone.addEventListener('click', () => {
            blackScreen.style.display = 'none'; // 點擊螢幕最上方後，將黑畫面隱藏
        });

        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
        downloadBtn.addEventListener('click', downloadAllVideos); 

        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 's' && !startBtn.disabled) startRecording();
            if (e.altKey && e.key.toLowerCase() === 'e' && !stopBtn.disabled) stopRecording();
            if (e.altKey && e.key.toLowerCase() === 'd' && !downloadBtn.disabled) downloadAllVideos();
        });
    </script>
</body>
</html>
