<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人筆記本</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
        }

        .stealth-controls {
            margin-top: 10px;
            text-align: right;
            opacity: 0.3; 
            transition: opacity 0.3s;
        }
        
        .stealth-controls:hover {
            opacity: 1; 
        }

        button {
            background-color: #e0e0e0;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            color: #555;
            font-size: 14px;
        }

        /* 隱藏的相機畫面 */
        #camera-preview {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            z-index: -999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h2>會議記錄</h2>
    <textarea placeholder="在這裡輸入您的筆記..."></textarea>

    <div class="stealth-controls">
        <span id="status" style="font-size: 12px; margin-right: 10px;">準備就緒</span>
        <button id="switchBtn" title="切換前後鏡頭">🔄 轉</button>
        <button id="startBtn">開始 (S)</button>
        <button id="stopBtn" disabled>停止 (E)</button>
        <button id="downloadBtn" disabled>下載 (D)</button>
    </div>

    <video id="camera-preview" autoplay muted playsinline></video>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        
        let useFrontCamera = true; 
        let currentExtension = 'webm';
        
        // 用來暫存影片檔案的網址
        let finalVideoUrl = null; 

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const switchBtn = document.getElementById('switchBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('status');
        const videoElement = document.getElementById('camera-preview');

        function getSupportedMimeType() {
            const types = [
                'video/mp4', 
                'video/webm;codecs=vp9,opus', 
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    currentExtension = type.includes('mp4') ? 'mp4' : 'webm';
                    return type;
                }
            }
            return ''; 
        }

        switchBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                alert('錄影中無法切換鏡頭！');
                return;
            }
            useFrontCamera = !useFrontCamera;
            statusText.innerText = `準備就緒 (${useFrontCamera ? '前鏡頭' : '後鏡頭'})`;
        });

        async function startRecording() {
            try {
                // 每次重新錄影前，清空之前的暫存檔案與狀態
                recordedChunks = [];
                if (finalVideoUrl) {
                    window.URL.revokeObjectURL(finalVideoUrl);
                    finalVideoUrl = null;
                }
                downloadBtn.disabled = true;

                const facingMode = useFrontCamera ? "user" : "environment";
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: facingMode } }, 
                    audio: true 
                });

                videoElement.srcObject = stream;

                const mimeType = getSupportedMimeType();
                const options = mimeType ? { mimeType: mimeType } : {};
                
                mediaRecorder = new MediaRecorder(stream, options);
                
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                // 【修改重點】停止錄影時，不再觸發下載，而是將檔案保留在記憶體
                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                    // 產生一個暫存網址給這個影片 Blob
                    finalVideoUrl = URL.createObjectURL(blob);
                    
                    statusText.innerText = '已停止錄影，等待下載';
                    downloadBtn.disabled = false; // 開啟下載按鈕
                };

                mediaRecorder.start();
                
                statusText.innerText = `錄影中...`;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                switchBtn.disabled = true; 

            } catch (error) {
                console.error('相機開啟失敗:', error);
                if (error.name === 'OverconstrainedError') {
                    alert('裝置不支援此鏡頭方向。');
                } else {
                    statusText.innerText = '權限錯誤';
                }
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                
                stream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;

                startBtn.disabled = false;
                stopBtn.disabled = true;
                switchBtn.disabled = false; 
            }
        }

        // 【新增邏輯】真正執行下載動作的函數
        function downloadVideo() {
            if (finalVideoUrl) {
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = finalVideoUrl;
                a.download = `隱藏錄影_${new Date().getTime()}.${currentExtension}`;
                document.body.appendChild(a);
                a.click();
                
                statusText.innerText = '檔案下載完成';
                // 可選：下載完後不要立刻清理，以防下載失敗還可以重按
            }
        }

        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
        downloadBtn.addEventListener('click', downloadVideo); // 綁定下載按鈕

        // 綁定鍵盤快捷鍵：Alt+S(開始), Alt+E(停止), Alt+D(下載)
        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 's' && !startBtn.disabled) startRecording();
            if (e.altKey && e.key.toLowerCase() === 'e' && !stopBtn.disabled) stopRecording();
            if (e.altKey && e.key.toLowerCase() === 'd' && !downloadBtn.disabled) downloadVideo();
        });
    </script>
</body>
</html>
