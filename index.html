<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>notebook</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
        }

        .stealth-controls {
            margin-top: 10px;
            text-align: right;
            opacity: 0.3; 
            transition: opacity 0.3s;
        }
        
        .stealth-controls:hover {
            opacity: 1; 
        }

        button {
            background-color: #e0e0e0;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            color: #555;
            font-size: 14px;
        }

        /* 隱藏的相機畫面 */
        #camera-preview {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            z-index: -999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h2>簡單紀錄當下</h2>
    <textarea placeholder="在這裡輸入您的筆記..."></textarea>

    <div class="stealth-controls">
        <span id="status" style="font-size: 12px; margin-right: 10px;">準備就緒 (前鏡頭)</span>
        <button id="switchBtn" title="切換前後鏡頭">🔄 轉</button>
        <button id="startBtn">開始 (S)</button>
        <button id="stopBtn" disabled>停止 (E)</button>
    </div>

    <video id="camera-preview" autoplay muted playsinline></video>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        
        // 預設使用前鏡頭 (user 為前鏡頭，environment 為後鏡頭)
        let useFrontCamera = true; 
        let currentExtension = 'webm'; // 預設副檔名

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const switchBtn = document.getElementById('switchBtn');
        const statusText = document.getElementById('status');
        const videoElement = document.getElementById('camera-preview');

        // 自動偵測瀏覽器支援的最佳影片格式
        function getSupportedMimeType() {
            const types = [
                'video/mp4', // iOS Safari 偏好格式
                'video/webm;codecs=vp9,opus', // 現代 Chrome/Android
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    currentExtension = type.includes('mp4') ? 'mp4' : 'webm';
                    return type;
                }
            }
            return ''; // 若都沒比對到，就讓瀏覽器用預設值
        }

        // 切換鏡頭按鈕事件
        switchBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                alert('錄影中無法切換鏡頭，請先停止錄影！');
                return;
            }
            useFrontCamera = !useFrontCamera;
            statusText.innerText = `準備就緒 (${useFrontCamera ? '前鏡頭' : '後鏡頭'})`;
        });

        async function startRecording() {
            try {
                // 根據 useFrontCamera 決定要開啟哪一個鏡頭
                const facingMode = useFrontCamera ? "user" : "environment";
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: facingMode } }, // exact 強制要求使用該鏡頭
                    audio: true 
                });

                videoElement.srcObject = stream;

                // 取得裝置支援的格式
                const mimeType = getSupportedMimeType();
                const options = mimeType ? { mimeType: mimeType } : {};
                
                mediaRecorder = new MediaRecorder(stream, options);
                
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    // 使用偵測到的副檔名儲存檔案
                    a.download = `隱藏錄影_${new Date().getTime()}.${currentExtension}`;
                    document.body.appendChild(a);
                    a.click();
                    
                    window.URL.revokeObjectURL(url);
                    recordedChunks = [];
                };

                mediaRecorder.start();
                
                statusText.innerText = `錄影中... (${useFrontCamera ? '前' : '後'})`;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                switchBtn.disabled = true; // 錄影時禁用切換按鈕

            } catch (error) {
                console.error('相機開啟失敗:', error);
                // 容錯處理：如果裝置沒有後鏡頭，exact 參數可能會報錯，自動降級處理
                if (error.name === 'OverconstrainedError') {
                    alert('您的裝置似乎不支援您選擇的鏡頭方向，請切換後重試。');
                } else {
                    statusText.innerText = '權限錯誤或無相機';
                }
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                
                stream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;

                statusText.innerText = `已儲存檔案 (${currentExtension})`;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                switchBtn.disabled = false; // 恢復切換按鈕
            }
        }

        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
    </script>
</body>
</html>
